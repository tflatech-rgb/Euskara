<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b7a45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Euskara">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<title>Euskara pausoz pauso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  /* Idea: una columna de 720px. Arriba el marcador (racha, XP, meta del día), debajo el camino de unidades.
     El euskera siempre en la tipografía grande y verde; el castellano en la de lectura. Lecciones a pantalla completa. */
  --bg:#edf2ea;
  --surface:#ffffff;
  --ink:#13261b;
  --muted:#56695c;
  --line:#cdd9cf;
  --green:#1b7a45;
  --green-deep:#125a32;
  --green-soft:#dcefe2;
  --red:#cf3329;
  --red-soft:#fbe1de;
  --gold:#b97f00;
  --on-accent:#ffffff;
  --rope:#b58a4c;
  --rope-hi:#ecd3a0;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1912;--surface:#16251c;--ink:#e7f0e9;--muted:#9cb0a2;--line:#2b3f32;
    --green:#4fc583;--green-deep:#2f9c61;--green-soft:#1c3527;--red:#ff7163;--red-soft:#43201c;
    --gold:#f0bb3c;--on-accent:#08130c;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1912;--surface:#16251c;--ink:#e7f0e9;--muted:#9cb0a2;--line:#2b3f32;
  --green:#4fc583;--green-deep:#2f9c61;--green-soft:#1c3527;--red:#ff7163;--red-soft:#43201c;
  --gold:#f0bb3c;--on-accent:#08130c;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
.flag{height:6px;background:linear-gradient(90deg,var(--red) 0 33.3%,var(--surface) 33.3% 66.6%,var(--green) 66.6%)}

/* cabecera */
.top{padding:22px 0 14px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:clamp(2rem,7vw,3rem);font-weight:800;letter-spacing:-.02em;color:var(--green)}
.brand h1 span{color:var(--ink)}
.brand p{margin:0;color:var(--muted);font-size:.95rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:.8rem;color:var(--muted)}
.stat.streak b{color:var(--red)}
.stat.xp b{color:var(--gold)}
.stat.words b{color:var(--green)}
.goal{display:flex;align-items:center;gap:10px;font-size:.85rem;color:var(--muted)}
.bar{flex:1;height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .35s}
.tabs{display:flex;gap:6px;border-bottom:2px solid var(--line);margin-top:4px}
.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-weight:700;padding:10px 2px;font-size:.95rem;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0}
.tabs a small{display:block;font-weight:400;font-size:.72rem}
.tabs a[aria-current="page"]{color:var(--green);border-bottom-color:var(--green)}

.rank{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 14px;flex:1 1 250px;max-width:340px;text-decoration:none;color:inherit}
.rank .who{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.rank b{font-family:var(--display);font-weight:800;font-size:1.25rem;line-height:1;color:var(--green)}
.rank b span{font-family:var(--body);font-weight:400;font-size:.85rem;color:var(--muted);margin-left:6px}
.rank small{font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums}
.rank .bar{height:8px;flex:none}
.rank .bar i{background:var(--gold)}
.crest{flex:none;display:block}
.ladder{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.ladder li{display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.ladder li.todo{opacity:.6}
.ladder li.cur{border:2px solid var(--gold)}
.ladder .nm{flex:1;min-width:0}
.ladder .nm b{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--green);display:block;line-height:1.1}
.ladder .nm span{font-size:.88rem;color:var(--muted)}
.ladder .need{text-align:right;font-size:.85rem;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.ladder .need b{display:block;color:var(--ink);font-size:1rem}
.rules{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;font-size:.93rem}
.rules h3{font-size:1.1rem;margin-bottom:6px}
.rules ul{margin:0;padding-left:20px}
.rankup{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--gold);border-radius:16px;padding:12px 18px;text-align:left}
.rankup b{font-family:var(--display);font-size:1.3rem;color:var(--green);display:block}
.stars{color:var(--gold);letter-spacing:1px}
.avatar{display:block;flex:none;border-radius:16px;overflow:hidden;line-height:0}
.avatar svg{display:block}
.ladder li.todo .avatar{filter:grayscale(1)}
.me{display:flex;align-items:center;gap:18px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.me h2{font-size:2rem;font-weight:800;color:var(--green)}
.me p{margin:4px 0 0;color:var(--muted)}
.ropes{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:0 clamp(56px,18vw,130px)}
.rope-col{display:flex;flex-direction:column;gap:12px}
.rope-item{position:relative;justify-content:center;text-align:center;touch-action:none;user-select:none;-webkit-user-select:none;min-height:54px}
.rope-item.eu{font-weight:700}
.rope-item::after{content:"";position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--rope);border:2px solid var(--surface);transform:translateY(-50%)}
.rope-item.eu::after{right:-9px}
.rope-item.es::after{left:-9px}
.opt.tied{border-color:var(--green);background:var(--green-soft);box-shadow:none;color:var(--ink);opacity:1}
.rope-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:2}
.rope{fill:none;stroke:var(--rope);stroke-width:6;stroke-linecap:round}
.rope.tw{stroke:var(--rope-hi);stroke-width:2.5;stroke-dasharray:1 8}
.bad .rope{stroke:var(--red)}
.bad .rope.tw{stroke:var(--red-soft)}
@media (max-width:640px){
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;margin:0;gap:0;background:var(--surface);border-bottom:0;border-top:2px solid var(--line);padding:4px 6px 8px}
  .tabs a{border-bottom:0;border-top:3px solid transparent;margin:0;border-radius:0 0 8px 8px;padding:8px 2px}
  .tabs a[aria-current="page"]{border-top-color:var(--green)}
  main{padding-bottom:110px}
  .top{padding-top:14px;gap:12px}
  .brand p{display:none}
  .rank{max-width:none}
  .stat b{font-size:1.35rem}
  .opt,.chip,.lesson{min-height:48px}
  .unit-head{flex-wrap:wrap}
  .unit-head>div:nth-child(2){flex:1;min-width:0}
  .unit-count{flex-basis:100%;margin:0;padding:0}
}
body{padding-top:env(safe-area-inset-top)}
.stage{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
@media (max-width:640px){.tabs{padding-bottom:calc(8px + env(safe-area-inset-bottom))}main{padding-bottom:calc(110px + env(safe-area-inset-bottom))}}
/* botones */
.btn{border:0;border-radius:14px;padding:13px 20px;font-weight:700;background:var(--green);color:var(--on-accent);box-shadow:0 4px 0 var(--green-deep);transition:transform .05s, box-shadow .05s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--green-deep)}
.btn:disabled{background:var(--line);color:var(--muted);box-shadow:none}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.bad{background:var(--red);box-shadow:0 4px 0 color-mix(in srgb,var(--red) 70%,#000)}
.spk{display:none;border:2px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;padding:0;flex:none;align-items:center;justify-content:center;color:var(--green)}
.has-tts .spk{display:inline-flex}
.spk svg{width:18px;height:18px}

/* inicio */
main{padding:18px 0 60px;display:flex;flex-direction:column;gap:16px}
.view{display:none;flex-direction:column;gap:16px}
.view.on{display:flex}
.next{background:var(--green);color:var(--on-accent);border-radius:18px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.next h2{font-size:1.5rem;font-weight:800}
.next p{margin:2px 0 0;opacity:.9;font-size:.92rem}
.next .btn{background:var(--surface);color:var(--green);box-shadow:0 4px 0 rgba(0,0,0,.25)}
.review{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--red-soft);border-radius:14px;padding:12px 14px;font-size:.95rem}
.unit{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.unit.locked{opacity:.62}
.unit-head{display:flex;gap:14px;align-items:flex-start}
.unit-num{font-family:var(--display);font-weight:800;font-size:1.05rem;color:var(--on-accent);background:var(--green);border-radius:10px;min-width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-variant-numeric:tabular-nums}
.unit.locked .unit-num{background:var(--line);color:var(--muted)}
.unit.complete .unit-num{background:var(--gold)}
.lesson.now .stars{color:inherit}
.unit-head h2{font-size:1.55rem;font-weight:800;color:var(--green)}
.unit.locked h2{color:var(--muted)}
.unit-head p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.unit-count{margin-left:auto;font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;padding-top:4px}
.lessons{display:flex;gap:8px;flex-wrap:wrap}
.lesson{flex:1 1 130px;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;font-weight:700;display:flex;flex-direction:column;gap:1px;box-shadow:0 3px 0 var(--line)}
.lesson small{font-weight:400;color:var(--muted);font-size:.78rem}
.lesson.done{background:var(--green-soft);border-color:var(--green);box-shadow:0 3px 0 var(--green)}
.lesson.done small{color:var(--muted)}
.lesson.now{background:var(--green);color:var(--on-accent);border-color:var(--green-deep);box-shadow:0 3px 0 var(--green-deep)}
.lesson.now small{color:inherit;opacity:.9}
.lesson:disabled{box-shadow:none;color:var(--muted)}
details.tip{border-top:1px dashed var(--line);padding-top:10px;font-size:.93rem}
details.tip summary{cursor:pointer;font-weight:700;color:var(--muted)}
details.tip p{margin:8px 0 0;max-width:65ch}
details.tip b{color:var(--green)}
.save-note{font-size:.8rem;color:var(--muted);text-align:center;margin:0}

/* juegos */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.game h3{font-size:1.35rem;font-weight:800;color:var(--green)}
.game p{margin:0;color:var(--muted);font-size:.92rem;flex:1}
.game .best{font-size:.82rem;color:var(--gold);font-weight:700}

/* vocabulario */
.vocab details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.vocab{display:flex;flex-direction:column;gap:10px}
.vocab summary{cursor:pointer;font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--green)}
.vocab summary small{font-family:var(--body);font-weight:400;color:var(--muted);font-size:.85rem;margin-left:6px}
.vlist{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 18px}
.vlist li{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.vlist .eu{font-weight:700}
.vlist .es{color:var(--muted);margin-left:auto;text-align:right}
.vlist li.new .eu{color:var(--muted);font-weight:400}
.vlist .spk{width:30px;height:30px}
.vsub{margin:14px 0 0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}

/* lección */
.stage{position:fixed;inset:0;background:var(--bg);display:none;flex-direction:column;z-index:10}
.stage.on{display:flex}
.stage-top{display:flex;align-items:center;gap:12px;padding:14px 16px;max-width:720px;width:100%;margin:0 auto}
.close{border:0;background:none;font-size:1.6rem;line-height:1;padding:4px 8px;color:var(--muted);border-radius:8px}
.stage-top .bar{height:14px}
.stage-top .tag{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage-body{flex:1;overflow-y:auto;padding:8px 16px 20px}
.ex{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.ex .kicker{font-size:.9rem;color:var(--muted);font-weight:700;margin:0}
.prompt{display:flex;align-items:center;gap:12px}
.prompt .q{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.1}
.prompt .q.eu{color:var(--green)}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:13px 14px;text-align:left;display:flex;gap:12px;align-items:center;box-shadow:0 3px 0 var(--line);font-size:1.05rem}
.opt kbd{font-family:var(--body);font-size:.78rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.opt.sel{border-color:var(--green);background:var(--green-soft);box-shadow:0 3px 0 var(--green)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.no{border-color:var(--red);background:var(--red-soft);box-shadow:0 3px 0 var(--red)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}
.cols .opt{justify-content:center;text-align:center}
.cols .opt.eu{font-weight:700}
.opt.gone{opacity:.35;box-shadow:none;border-color:var(--green)}
.line{min-height:62px;border-bottom:2px solid var(--line);border-top:2px solid var(--line);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 13px;box-shadow:0 3px 0 var(--line);font-weight:700}
.chip.used{visibility:hidden}
.field{width:100%;font:inherit;font-size:1.2rem;padding:14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--ink)}
.field:focus{outline:none;border-color:var(--green)}
.intro-list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.intro-list li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.intro-list .eu{font-family:var(--display);font-weight:800;font-size:1.2rem;color:var(--green)}
.intro-list .es{margin-left:auto;color:var(--muted);text-align:right}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){.shake{animation:none}.bar i,.btn{transition:none}}
.stage-foot{border-top:2px solid var(--line);padding:14px 16px}
.stage-foot.ok{background:var(--green-soft);border-color:var(--green)}
.stage-foot.no{background:var(--red-soft);border-color:var(--red)}
.foot-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.fb{flex:1 1 220px;min-width:0}
.fb b{font-family:var(--display);font-size:1.2rem;display:block}
.stage-foot.ok .fb b{color:var(--green)}
.stage-foot.no .fb b{color:var(--red)}
.fb span{font-size:.95rem;overflow-wrap:anywhere}
.end{text-align:center;align-items:center;padding-top:6vh}
.end h2{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:800;color:var(--green)}
.end .nums{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.end .stat{min-width:120px;align-items:center}

/* juegos en escena */
.hud{display:flex;justify-content:space-between;font-weight:700;font-variant-numeric:tabular-nums}
.hud .t{color:var(--red)}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:420px){.mem{grid-template-columns:repeat(3,1fr)}}
.card{aspect-ratio:1/1;min-height:74px;border:2px solid var(--line);border-radius:12px;background:var(--green);color:transparent;font-weight:700;font-size:.9rem;padding:4px;display:flex;align-items:center;justify-content:center;text-align:center;overflow-wrap:anywhere;box-shadow:0 3px 0 var(--green-deep)}
.card.up{background:var(--surface);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.card.up.eu{color:var(--green)}
.card.hit{background:var(--green-soft);color:var(--ink);border-color:var(--green);box-shadow:none}
.slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;min-height:52px}
.slot{width:42px;height:48px;border-bottom:3px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--green);text-transform:lowercase}
.chip.letter{min-width:44px;font-size:1.2rem;text-align:center}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
</style>
</head>
<body>
<div class="flag" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div>
        <h1>Euskara <span>pausoz pauso</span></h1>
        <p>Euskera paso a paso: de campesino a rey.</p>
      </div>
      <a class="rank" href="#rangos" aria-label="Tu rango">
        <span id="rank-crest"></span>
        <span class="who"><b id="rank-name"></b><span class="bar"><i id="rank-bar"></i></span><small id="rank-next"></small></span>
      </a>
    </div>
    <div class="stats">
      <div class="stat streak"><b id="st-streak">0</b><span>días de racha</span></div>
      <div class="stat xp"><b id="st-xp">0</b><span>puntos XP</span></div>
      <div class="stat words"><b id="st-words">0</b><span>palabras aprendidas</span></div>
    </div>
    <div class="goal"><span>Meta de hoy</span><div class="bar"><i id="goal-bar"></i></div><span id="goal-txt">0 / 30 XP</span></div>
    <nav class="tabs" aria-label="Secciones">
      <a href="#aprender" data-tab="aprender">Ikasi<small>Aprender</small></a>
      <a href="#juegos" data-tab="juegos">Jolasak<small>Juegos</small></a>
      <a href="#rangos" data-tab="rangos">Mailak<small>Rangos</small></a>
      <a href="#vocabulario" data-tab="vocabulario">Hiztegia<small>Vocabulario</small></a>
    </nav>
  </header>
  <main>
    <section class="view" id="view-aprender"></section>
    <section class="view" id="view-juegos"></section>
    <section class="view" id="view-rangos"></section>

async function connectCloud(){

function el(tag,props,...kids){

    else if(k==="html")n.innerHTML=props[k];

}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function range(a,b){const r=[];for(let i=a;i<b;i++)r.push(i);return r}
function norm(s){return s.toLowerCase().replace(/[¿?¡!.,;:]/g,"").replace(/\s+/g," ").trim()}
function lev(a,b){const m=[];for(let i=0;i<=a.length;i++){m[i]=[i];for(let j=1;j<=b.length;j++)m[i][j]=i===0?j:Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1))}return m[a.length][b.length]}
function toks(s){const t=s.replace(/[¿?¡!.,;:]/g,"").split(/\s+/).filter(Boolean);if(t.length&&!PROPER.has(t[0]))t[0]=t[0].toLowerCase();return t}

function lessons(ui){
  const u=U[ui],n=u.w.length,hf=Math.ceil(n/2),pn=u.p.length;
  const r=[{k:"w",ix:range(0,hf),name:"Palabras 1"},{k:"w",ix:range(hf,n),name:"Palabras 2"}];
  if(pn>7){const ph=Math.ceil(pn/2);r.push({k:"p",ix:range(0,ph),name:"Frases 1"},{k:"p",ix:range(ph,pn),name:"Frases 2"})}
  else r.push({k:"p",ix:range(0,pn),name:"Frases"});
  return r;
}
function isDone(ui,li){return !!S.done[ui+"-"+li]}
function stars(ui,li){return Math.min(3,+S.done[ui+"-"+li]||0)}
function starTxt(n){return "★".repeat(n)+"☆".repeat(3-n)}
function nextStar(){for(let lv=1;lv<3;lv++)for(let ui=0;ui<U.length;ui++){const ls=lessons(ui);for(let li=0;li<ls.length;li++)if(stars(ui,li)<=lv&&stars(ui,li)<3)return{ui,li}}return null}
function unitDone(ui){return lessons(ui).every((_,li)=>isDone(ui,li))}
function isOpen(ui,li){return li>0?isDone(ui,li-1):(ui===0||unitDone(ui-1))}
function nextLesson(){for(let ui=0;ui<U.length;ui++){const ls=lessons(ui);for(let li=0;li<ls.length;li++)if(!isDone(ui,li))return{ui,li}}return null}
function item(key){const[a,k,i]=key.split(":");const u=U[+a];if(!u)return null;const x=(k==="w"?u.w:u.p)[+i];return x?{key,eu:x[0],es:x[1],k,ui:+a}:null}
function pool(ui,k){const u=U[ui];return (k==="w"?u.w:u.p).map((x,i)=>({key:ui+":"+k+":"+i,eu:x[0],es:x[1],k,ui}))}
function learnedWords(){
  const out=[];
  U.forEach((u,ui)=>lessons(ui).forEach((l,li)=>{if(l.k==="w"&&isDone(ui,li))l.ix.forEach(i=>out.push({key:ui+":w:"+i,eu:u.w[i][0],es:u.w[i][1]}))}));
  return out;
}
function playPool(){const lw=learnedWords();if(lw.length>=8)return lw;const base=pool(0,"w");const seen=new Set(lw.map(x=>x.key));return lw.concat(base.filter(x=>!seen.has(x.key))).slice(0,Math.max(9,lw.length))}

/* ===================== GENERAR EJERCICIOS ===================== */
function mc(it,pl,dir){
  const ans=dir==="eu"?it.es:it.eu, seen=new Set([ans]), ds=[];
  shuffle(pl).forEach(x=>{const v=dir==="eu"?x.es:x.eu;if(x.eu!==it.eu&&x.es!==it.es&&!seen.has(v)&&ds.length<3){seen.add(v);ds.push(v)}});
  return{t:"mc",it,dir,q:dir==="eu"?it.eu:it.es,ans,opts:shuffle(ds.concat(ans))};
}
function build(it,pl,nd){nd=nd||3;
  const target=toks(it.eu),low=new Set(target.map(x=>x.toLowerCase())),ds=[];
  shuffle(pl).forEach(x=>{if(x.key!==it.key)toks(x.eu).forEach(w=>{if(!low.has(w.toLowerCase())&&ds.length<nd){low.add(w.toLowerCase());ds.push(w)}})});
  return{t:"build",it,bank:shuffle(target.concat(ds))};
}
function genLesson(ui,li,lv){
  const l=lessons(ui)[li],pl=pool(ui,l.k),its=l.ix.map(i=>pl[i]),ex=[];lv=lv||0;
  if(l.k==="w"){
    if(lv===0){
      ex.push({t:"intro",items:its,title:"Palabras nuevas"});
      shuffle(its).forEach((it,n)=>{ex.push(mc(it,pl,n%2?"es":"eu"));if(n===3)ex.push({t:"match",items:shuffle(its).slice(0,5)})});
      shuffle(its).slice(0,3).forEach(it=>ex.push({t:"type",it}));
      ex.push({t:"match",items:shuffle(its).slice(0,5)});
    }else if(lv===1){
      shuffle(its).forEach((it,n)=>ex.push(n%2?{t:"type",it}:mc(it,pl,"es")));
      ex.push({t:"match",items:shuffle(its).slice(0,5)});
      shuffle(its).slice(0,4).forEach(it=>ex.push({t:"type",it}));
    }else{
      shuffle(its).forEach((it,n)=>{ex.push({t:"type",it});if(n===3)ex.push({t:"match",items:shuffle(its).slice(0,5)})});
      shuffle(its).slice(0,4).forEach(it=>ex.push(mc(it,pl,"es")));
    }
  }else{
    if(lv===0){
      ex.push({t:"intro",items:its,title:"Frases nuevas"});
      shuffle(its).forEach(it=>ex.push(mc(it,pl,"eu")));
      shuffle(its).forEach(it=>ex.push(build(it,pl)));
    }else if(lv===1){
      shuffle(its).forEach(it=>ex.push(mc(it,pl,"es")));
      shuffle(its).forEach(it=>ex.push(build(it,pl,5)));
    }else{
      shuffle(its).forEach(it=>ex.push(build(it,pl,6)));
      shuffle(its).forEach(it=>ex.push(toks(it.eu).length<=3?{t:"type",it}:mc(it,pl,"es")));
    }
  }
  return ex;
}
function genReview(){
  const ex=[];
  shuffle(S.miss).slice(0,8).map(item).filter(Boolean).forEach(it=>{
    const pl=pool(it.ui,it.k);
    if(it.k==="w"){ex.push(mc(it,pl,"es"));ex.push({t:"type",it})}
    else{ex.push(mc(it,pl,"eu"));ex.push(build(it,pl))}
  });
  return ex;
}
